name: Compiler VIB Alert Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/vib_alert/**"
      - ".github/workflows/build-vib-alert-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sauvegarder le projet personnalisé
        shell: bash
        run: |
          set -e

          test -d mobile/vib_alert

          rm -rf /tmp/vib_alert_source
          cp -a mobile/vib_alert /tmp/vib_alert_source

      - name: Recréer la structure Flutter
        shell: bash
        run: |
          set -e

          rm -rf mobile/vib_alert

          flutter create \
            --platforms=android,ios \
            --org com.vibplus \
            --project-name vib_alert \
            mobile/vib_alert

      - name: Restaurer les fichiers de l’application
        shell: bash
        run: |
          set -e

          cp /tmp/vib_alert_source/pubspec.yaml \
            mobile/vib_alert/pubspec.yaml

          rm -rf mobile/vib_alert/lib
          cp -a /tmp/vib_alert_source/lib \
            mobile/vib_alert/lib

          cp /tmp/vib_alert_source/android/app/google-services.json \
            mobile/vib_alert/android/app/google-services.json

          cp /tmp/vib_alert_source/android/app/src/main/AndroidManifest.xml \
            mobile/vib_alert/android/app/src/main/AndroidManifest.xml

          rm -rf \
            mobile/vib_alert/android/app/src/main/kotlin/com/vibplus/vib_alert

          mkdir -p \
            mobile/vib_alert/android/app/src/main/kotlin/com/vibplus/vib_alert

          cp -a \
            /tmp/vib_alert_source/android/app/src/main/kotlin/com/vibplus/vib_alert/. \
            mobile/vib_alert/android/app/src/main/kotlin/com/vibplus/vib_alert/

          if [ -d /tmp/vib_alert_source/android/app/src/main/res/values ]; then
            cp -a \
              /tmp/vib_alert_source/android/app/src/main/res/values/. \
              mobile/vib_alert/android/app/src/main/res/values/
          fi

      - name: Configurer les versions Android modernes
        shell: bash
        run: |
          set -e

          cat > mobile/vib_alert/android/settings.gradle <<'GRADLE'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }

                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null :
                      "flutter.sdk non défini dans local.properties"

                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.2" apply false
              id "org.jetbrains.kotlin.android" version "2.1.10" apply false
              id "com.google.gms.google-services" version "4.4.3" apply false
          }

          include ":app"
          GRADLE

          cat > mobile/vib_alert/android/build.gradle <<'GRADLE'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > mobile/vib_alert/android/gradle/wrapper/gradle-wrapper.properties <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          PROPERTIES

      - name: Configurer l’application Android
        shell: bash
        run: |
          set -e

          rm -f mobile/vib_alert/android/app/build.gradle.kts

          cat > mobile/vib_alert/android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }

          android {
              namespace = "com.vibplus.vib_alert"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.vibplus.vib_alert"
                  minSdk = 23
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring \
                  "com.android.tools:desugar_jdk_libs:2.1.4"

              implementation platform(
                  "com.google.firebase:firebase-bom:34.16.0"
              )

              implementation \
                  "com.google.firebase:firebase-messaging"
          }

          flutter {
              source = "../.."
          }
          GRADLE

      - name: Corriger le thème Android
        shell: bash
        run: |
          set -e

          mkdir -p mobile/vib_alert/android/app/src/main/res/values

          cat > mobile/vib_alert/android/app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style
                  name="LaunchTheme"
                  parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowFullscreen">true</item>
              </style>

              <style
                  name="NormalTheme"
                  parent="@android:style/Theme.Black.NoTitleBar" />
          </resources>
          XML

      - name: Installer les dépendances
        working-directory: mobile/vib_alert
        run: flutter pub get

      - name: Vérifier Firebase
        run: |
          test -f \
            mobile/vib_alert/android/app/google-services.json

      - name: Compiler l’APK release
        working-directory: mobile/vib_alert
        run: flutter build apk --release

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: VIB-Alert-Android-V5.6.2
          path: mobile/vib_alert/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
